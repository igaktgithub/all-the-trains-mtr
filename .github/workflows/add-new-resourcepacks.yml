name: Add new MTR4 resource packs and update pack

on:
  schedule:
    # Runs daily. This job now also covers what update-mods.yml used to do
    # (packwiz refresh / update --all / refresh) -- if you keep both
    # workflows enabled, disable or delete update-mods.yml so they don't
    # both push to main and race each other.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  add-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install packwiz
        run: |
          git clone --depth 1 https://github.com/packwiz/packwiz.git /tmp/packwiz-src
          cd /tmp/packwiz-src
          go build -o "$(go env GOPATH)/bin/packwiz" .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add new resource packs and update the pack
        run: |
          set -o pipefail
          python3 scripts/add_new_resourcepacks.py | tee /tmp/script-output.txt

      - name: Extract commit message
        run: |
          awk '/^::commit-message-start::$/{flag=1; next} /^::commit-message-end::$/{flag=0} flag' \
            /tmp/script-output.txt > /tmp/commit-message.txt
          cat /tmp/commit-message.txt

      - name: Commit and push
        run: |
          if [ ! -s /tmp/commit-message.txt ]; then
            echo "Nothing added or updated, nothing to commit."
            exit 0
          fi
          git add -A
          git commit -F /tmp/commit-message.txt
          git push
